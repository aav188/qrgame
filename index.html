<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width">
<title>Juego QR</title>
<body style="font:18px sans-serif;padding:16px">
<script>
// Lanzador: el juego NO está en esta página. Viene comprimido dentro del QR,
// después del "#" del enlace. Esta página solo lo descomprime y lo ejecuta.
// (Lo que va después del "#" nunca se envía al servidor.)
(async () => {
  const h = location.hash.slice(1);
  if (!h) {
    document.body.textContent = 'Escanea un código QR de juego para jugar.';
    return;
  }
  try {
    // Formato nuevo: "base43" (solo mayúsculas, números y $*+-./:), que el QR
    // guarda en su modo alfanumérico, más compacto. Formato antiguo: base64.
    const A = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$*+-./:';
    let bytes;
    if (/^[0-9A-Z$*+\-.\/:]+$/.test(h)) {
      const out = [];
      for (let i = 0; i < h.length; i += 3) {
        const c = [...h.slice(i, i + 3)].map(x => A.indexOf(x));
        if (c.length === 3) { const n = c[0] + c[1] * 43 + c[2] * 1849; out.push(n >> 8, n & 255); }
        else out.push(c[0] + c[1] * 43);
      }
      bytes = new Uint8Array(out);
    } else {
      bytes = Uint8Array.from(atob(h.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const juego = await new Response(stream).text();
    document.open();
    document.write(juego);
    document.close();
  } catch (e) {
    document.body.textContent = 'Este QR no contiene un juego válido.';
  }
})();
addEventListener('hashchange', () => location.reload());
</script>
